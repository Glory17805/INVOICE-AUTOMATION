# Runs the suite on every change.
#
# This exists because its absence is what let several real defects survive: a
# README committed with control bytes in every path, three tests quietly making
# live API calls, and those same tests writing to a running deployment's
# database. All of them were visible to a machine and invisible to a person
# who had stopped looking.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install
        run: python -m pip install -r backend/requirements-dev.txt

      - name: Lint
        run: python -m ruff check backend

      - name: Test
        # No provider key in CI, which is the point: conftest forces the offline
        # reader, so a test that reaches for the network fails here rather than
        # silently spending someone's quota.
        #
        # -ra prints the skip reasons. A run here is ~56 tests short of a local
        # one, because the workbook tests need the client's real file and it is
        # deliberately not in the repository. Printing why keeps a green tick
        # from being read as "everything was checked".
        working-directory: backend
        # Output is teed into the job summary as well as the log. Two failures
        # here could not be reproduced locally - not on Windows, not in a
        # Linux container matching this job, not against either engine - and
        # reading the log needs a token, so the one place the evidence existed
        # was the one place it could not be read. A summary is public.
        run: |
          set -o pipefail
          python -m pytest tests -ra --tb=short 2>&1 | tee /tmp/pytest.txt || status=$?
          {
            echo "### Test output"
            echo '```'
            tail -60 /tmp/pytest.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "${status:-0}"

      - name: Say what this run did not cover
        if: always()
        run: |
          {
            echo "### Coverage note"
            echo
            echo "The workbook tests assert against the client's real sheet - its own"
            echo "formula idioms and number formats - rather than a fixture that would"
            echo "only agree with itself. That file is a filing history and is not in"
            echo "the repository, so those tests **skip here** and run only on a machine"
            echo "that has it."
            echo
            echo "A green tick above means everything else passed."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check for control characters in tracked text
        # A README once shipped with real 0x08 and 0x0c bytes where escape text
        # belonged, making every quoted path uncopyable. Cheap to never repeat.
        run: |
          if git grep -nIP '[\x00-\x08\x0b\x0c\x0e-\x1f]' -- '*.md' '*.py' '*.js' '*.css' '*.html' '*.ps1' '*.txt' '*.toml' '*.yml'; then
            echo "::error::control characters found in tracked text files"
            exit 1
          fi
          echo "clean"
