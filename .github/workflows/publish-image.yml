# Build the API image and publish it to ghcr.io.
#
# Separate from deploy.yml, which pushes to an Azure Container Registry and
# needs Azure credentials. This one needs no secrets at all: GITHUB_TOKEN is
# minted per run and, with packages:write below, can push to this repository's
# own package namespace. That makes the image free to build and free to store.
#
# Only the API is built. The frontend is static files, published to Azure
# Static Web Apps at deploy time once the API's address is known.

name: Publish image

on:
  push:
    branches: [master]
    paths:
      - 'backend/**'
      - '.github/workflows/publish-image.yml'
  workflow_dispatch:

concurrency:
  group: publish-image
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Sign in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # An image reference must be lowercase, and github.repository_owner
      # preserves the account's own capitalisation - "Glory17805". Interpolated
      # straight into a tag that produces an invalid reference and the push
      # fails with an error about the name, not about the case.
      - name: Lowercase the owner
        id: owner
        run: echo "name=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          # Container Apps runs amd64. Left to the runner's default this would
          # still be amd64, but stating it means a future ARM runner cannot
          # silently publish an image that exits immediately on Azure.
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.name }}/gst-api:latest
            ghcr.io/${{ steps.owner.outputs.name }}/gst-api:${{ github.sha }}
          # Layer cache in the registry, so a code-only change does not
          # reinstall the ~400MB OCR dependency tree on every run.
          cache-from: type=registry,ref=ghcr.io/${{ steps.owner.outputs.name }}/gst-api:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ steps.owner.outputs.name }}/gst-api:buildcache,mode=max

      - name: Say what to do next
        run: |
          {
            echo "### Image published"
            echo
            echo '`ghcr.io/${{ github.repository_owner }}/gst-api:latest`'
            echo
            echo "A package is **private** the first time it is created, even in a"
            echo "public repository. Container Apps cannot pull it until it is made"
            echo "public, once:"
            echo
            echo "1. https://github.com/${{ github.repository_owner }}?tab=packages"
            echo "2. Open **gst-api** → Package settings"
            echo "3. Change visibility → Public"
            echo
            echo "After that every later push publishes without any further step."
          } >> "$GITHUB_STEP_SUMMARY"
